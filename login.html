<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Exam Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f7f6; color: #333; }
        .login-container { background: #fff; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 360px; text-align: center; }
        .login-container h1 { font-size: 1.8em; color: #0056b3; margin-bottom: 25px; }
        label { display: block; text-align: left; margin-bottom: 8px; font-weight: 600; font-size: 0.95em; }
        input[type="text"], input[type="password"] { width: calc(100% - 24px); padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; box-sizing: border-box; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #007bff; outline: none; box-shadow: 0 0 0 2px rgba(0,123,255,.25); }
        button { width: 100%; padding: 12px 18px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.3s ease; font-size: 1.05rem; font-weight: 500; }
        button:hover { background-color: #0056b3; }
        .flash-messages { list-style-type: none; padding: 0; margin-top: 20px; }
        .flash-messages li { padding: 10px 15px; margin-bottom: 10px; border-radius: 5px; font-weight: 500; border: 1px solid transparent; }
        .flash-messages li.error { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
        .flash-messages li.success { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        .flash-messages li.info { background-color: #d1ecf1; color: #0c5460; border-color: #bee5eb; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Exam Analyzer Login</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flash-messages">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login_route') }}">
            <div>
                <label for="email_address">Email Address:</label>
                <input type="text" id="email_address" name="email_address" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
